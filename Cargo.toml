# Attestify Kernel - Open Source

[package]
name = "kernel_oss"
version = "0.2.8"
edition = "2024"
description = "Shared Attestify kernel traits, values, errors, and gateway/use case seams."
license-file = "LICENSE"
repository = "https://github.com/attestify/kernel-oss"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/docs/**",
    "/src/**",
    "/examples/**",
    "/THIRD_PARTY_NOTICES.md",
    "/third-party/**",
    "/tools/unicode-nfc/**",
    "/tools/url-data/**",
    "/test_data/nfc/**",
    "/test_data/url/**",
    "/tests/nfc_text_unicode_17_conformance.rs",
]

[dependencies]
url = "2.5.4"

[dev-dependencies]
test_framework_oss = { git = "https://github.com/attestify/test-framework-oss.git", tag = "0.2.4" }
