# Attestify Kernel - Open Source

[package]
name = "kernel_oss"
version = "0.6.0"
edition = "2024"
description = "Shared Attestify kernel traits, values, errors, and gateway/use case seams."
license-file = "LICENSE"
repository = "https://github.com/attestify/kernel-oss"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/docs/**/*.md",
    "/docs/**/*.puml",
    "/src/**",
    "/examples/**",
    "/THIRD_PARTY_NOTICES.md",
    "/third-party/**",
    "/tools/unicode-nfc/**",
    "/tools/test-layout/**",
    "/tools/url-data/**",
    "/tests/**",
]

[[bench]]
name = "kernel_oss_url_performance"
path = "tools/url-data/url_performance.rs"
harness = false
test = false

[dev-dependencies]
test_framework_oss = { git = "https://github.com/attestify/test-framework-oss.git", tag = "0.2.4" }
